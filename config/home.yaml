# =============================================================================
# CONFIGURATION DU PORTFOLIO
# =============================================================================
# Modifiez ce fichier pour personnaliser votre portfolio.
# Chaque section peut être activée/désactivée individuellement.
# =============================================================================

profile:
  pseudo: "adenyrr"
  tagline: "Sysadmin, infrastructure cloud, open source, confidentialité et souveraineté"

# -----------------------------------------------------------------------------
# HERO
# -----------------------------------------------------------------------------
hero:
  kicker: "whoami"
  role: "infra & cloud; open source | privacy | sovereignty"
  statementLead: "Je construis des infrastructures"
  qualities: ["ouvertes", "souveraines", "automatisées"]
  consolePrompt: "adenyrr@workstation:~$"
  consoleCommands:
    - "terraform plan"
    - "kubectl get nodes"
    - "ansible-playbook deploy.yml"
    - "podman ps --format table"
  primaryAction:
    label: "Explorer mes projets"
    url: "#projects"
  secondaryAction:
    label: "Ouvrir ~/lab"
    url: "/infra"

systemWidget:
  ariaLabel: "Résumé système d’adenyrr"
  monogram: "a"
  orbitLabel: "SYS"
  windowTitle: "system.profile"
  terminal: "tty / 01"
  status: "ready"
  prompt: "adenyrr@home:~$"
  command: "fastfetch"
  commandFlag: "--config about.toml"
  identity: "adenyrr"
  hostSuffix: "@home"
  subtitle: "sovereign systems operator"
  operator: "operator"
  host: "adenyrr.me"
  role: "sysops"
  location: "Namur, BE"
  edgeNodes: 1
  architecture: "x86_64"
  memoryType: "DDR4"
  networkStack: ["OPNsense", "WireGuard", "BunkerWeb"]
  securityStack: ["SIEM", "CVE", "SOAR"]
  platformStack: ["Proxmox", "CEPH", "Kubernetes", "Podman"]
  systems: ["openSUSE", "Debian"]
  availability: "available"

# -----------------------------------------------------------------------------
# SECTIONS ACTIVABLES
# -----------------------------------------------------------------------------
sections:
  projects: true
  lab: true
  journey: true
  contact: true
  diplomas: true
  certifications: true
  jobs: true

sectionHeaders:
  projects:
    index: "01"
    path: "~/work"
    title: "Selected work"
    introduction: "Des systèmes conçus pour être compris, automatisés et réellement opérables."
  lab:
    index: "02"
    path: "~/lab"
    title: "Infrastructure, en direct du plan."
    introduction: "Explorez les couches d’un homelab qui sert autant de plateforme que de terrain d’expérimentation."
  journey:
    index: "03"
    path: "~/journey"
    title: "Parcours & credentials"
    introduction: "Un parcours non linéaire, guidé par le concret, la curiosité et l’apprentissage continu."
  contact:
    index: "04"
    path: "~/contact"
    title: "Construisons quelque chose de robuste."
    introduction: "Une idée, une infrastructure à fiabiliser ou simplement envie de parler Linux et open source ?"

labLayers:
  - id: "edge"
    label: "Edge"
    eyebrow: "WAN / frontière"
    title: "Edge & sécurité"
    text: "Filtrage, terminaison TLS et contrôle des flux avant exposition des services."
    tech: "OPNsense · BunkerWeb · CrowdSec"
    icon: "ShieldCheck"
  - id: "compute"
    label: "Compute"
    eyebrow: "Cluster / calcul"
    title: "Nœuds Proxmox"
    text: "Les nœuds orchestrent les charges virtuelles, les conteneurs et le stockage distribué."
    metrics: "compute"
    icon: "Server"
  - id: "platform"
    label: "Platform"
    eyebrow: "Services / plateforme"
    title: "Services souverains"
    text: "Applications, identité, observabilité et workloads Kubernetes exploités en autonomie."
    metrics: "platform"
    icon: "Box"
  - id: "data"
    label: "Data"
    eyebrow: "Stockage / résilience"
    title: "Données & sauvegardes"
    text: "Stockage distribué et NAS isolé pour concilier disponibilité, capacité et reprise."
    metrics: "storage"
    icon: "Network"

journey:
  careerCommand: "journalctl --career"
  experienceLabel: "Expérience"
  educationLabel: "Formation"
  credentialsCommand: "ls ~/credentials"
  credentialsTitle: "Certifications récentes"
  otherCredentialsLabel: "autres credentials"

contact:
  discordLabel: "discord"
  emailLabel: "mail"
  gpgPath: "gpg.public-key"
  gpgTitle: "Chiffrer un e-mail à mon intention"
  gpgDescription: "Téléchargez ma clé publique pour chiffrer votre message et vérifier mes signatures."
  gpgDownloadLabel: "Télécharger .asc"
  gpgPendingLabel: "key not published"

