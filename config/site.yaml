# =============================================================================
# CONFIGURATION GÉNÉRALE DU SITE
# =============================================================================
# Ce fichier centralise toute la configuration du site.
# Modifiez-le pour personnaliser l'ensemble du site.
# =============================================================================

site:
  title: "adenyrr"
  description: "About, infra, blog, docu and everything of adenyrr"
  url: "https://adenyrr.me"
  author: "adenyrr"
  email: "adenyrr@proton.me"
  locale: "fr"
  defaultImage: "/images/og-default.jpg"

# -----------------------------------------------------------------------------
# CLÉ PUBLIQUE GPG
# Cette clé publique peut être téléchargée depuis la section contact.
# Ne publiez jamais la clé privée.
# -----------------------------------------------------------------------------
gpg:
  enabled: true
  publicKeyUrl: "/keys/adenyrr.asc"
  fingerprint: "5EB9 CF03 84B1 52AF 0EEF  10C5 1AF8 05A5 CCB3 02DA"

# -----------------------------------------------------------------------------
# FONCTIONNALITÉS ACTIVABLES/DÉSACTIVABLES
# -----------------------------------------------------------------------------
features:
  infra: true
  blog: true
  docu: true

# -----------------------------------------------------------------------------
# APPARENCE
# -----------------------------------------------------------------------------
appearance:
  ambientBackground: true

# -----------------------------------------------------------------------------
# NAVIGATION HEADER
# -----------------------------------------------------------------------------
header:
  show: true
  brandName: "adenyrr"
  brandHost: "@home"
  navigation:
    - label: "home"
      route: "/"
      enabled: true
    - label: "blog"
      route: "/blog"
      feature: "blog"
      enabled: true
    - label: "infra"
      route: "/infra"
      feature: "infra"
      enabled: true
    - label: "docu"
      url: "https://docu.adenyrr.me"
      feature: "docu"
      enabled: true
      external: true
  socialLinks:
    - label: "GitHub"
      icon: "Github"
      url: "https://github.com/adenyrr"
      enabled: true
    - label: "GitLab"
      icon: "Gitlab"
      url: "https://gitlab.com/adenyrr"
      enabled: true
    - label: "LinkedIn"
      icon: "Linkedin"
      url: "https://be.linkedin.com/in/mvanhede"
      enabled: true
    - label: "Discord"
      icon: "MessageCircle"
      url: "https://discord.gg/NWVukm7zE2"
      enabled: true
    - label: "Email"
      icon: "Mail"
      url: "mailto:adenyrr@proton.me"
      enabled: true

# -----------------------------------------------------------------------------
# FOOTER
# -----------------------------------------------------------------------------
footer:
  show: true
  copyright: "Copyleft CC - BY-NC"
  author: "adenyrr"
  authorUrl: "https://adenyrr.me"
  signatureCommand: 'echo "thanks for visiting"'
  note: "Infrastructure · Cloud · Open source\nConstruit sobrement, hébergé avec intention."
  navigationLabel: "~/sitemap"
  connectLabel: "~/connect"
  backToTopLabel: "Haut de page"
  shellPrompt: "adenyrr@home"
  branch: "main"
  poweredBy:
    - label: "Astro"
      url: "https://astro.build/"
    - label: "GitLab"
      url: "https://gitlab.com/adenyrr"
  rss: true

# -----------------------------------------------------------------------------
# SEO
# -----------------------------------------------------------------------------
seo:
  sitemap: true
  robots: true
  openGraph: true
  twitterCard: true

# -----------------------------------------------------------------------------
# BLOG
# -----------------------------------------------------------------------------
blog:
  pageTitle: "Blog"
  pageDescription: "Blog articles"
  path: "writing"
  heading: "Notes depuis"
  headingAccent: "la console."
  introduction: "Des retours d’expérience sur Linux, l’infrastructure, le cloud et ce que j’apprends en construisant."
  emptyLabel: "Aucun article publié."
  readMoreLabel: "Lire la note"
  readingTimeSuffix: "min de lecture"
  backLabel: "Retour aux articles"
  rssTitle: "adenyrr.me - Blog"
  rssDescription: "Blog personnel - Tech, Homelab & DevOps"
