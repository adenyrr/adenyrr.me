image: node:22-alpine

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

stages:
  - build
  - deploy
  - maintenance

schedules:
  - cron: "0 3 * * 0"
    branch: $CI_DEFAULT_BRANCH
    pipeline: default

build:
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --prefer-offline --legacy-peer-deps
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy_cloudflare_pages:
  stage: deploy
  image: node:22-alpine
  before_script:
    - npm install -g wrangler
  script:
    - wrangler pages deploy dist/ --project-name=home
  environment:
    name: production
    url: https://adenyrr.me
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

renovate:
  stage: maintenance
  image:
    name: ghcr.io/renovatebot/renovate:latest
    entrypoint: [""]
  variables:
    RENOVATE_PLATFORM: gitlab
    RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
    RENOVATE_GITLAB_TOKEN: "$RENOVATE_TOKEN"
    RENOVATE_REQUIRE_CONFIG: "true"
  script:
    - renovate
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual

credly_sync:
  stage: maintenance
  image: node:22-alpine
  before_script:
    - npm ci --prefer-offline --legacy-peer-deps
  script:
    - npm run sync:credly
    - |
      if ! git diff --quiet -- config/home.yaml; then
        git config user.name "GitLab CI"
        git config user.email "gitlab-ci@localhost"
        git add config/home.yaml
        git commit -m "chore: sync Credly certifications"
        git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_COMMIT_REF_NAME}"
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual