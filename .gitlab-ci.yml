image: node:22-alpine

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

stages:
  - build
  - deploy

build:
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - npm ci --prefer-offline
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 day
  only:
    - main

deploy_cloudflare_pages:
  stage: deploy
  image: node:22-alpine
  dependencies:
    - build
  before_script:
    - npm install -g @cloudflare/wrangler@latest
  script:
    # Deploy to Cloudflare Pages using Wrangler
    # Requires CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitLab CI/CD variables
    - wrangler pages deploy dist/ --project-name=adenyrr-me
  environment:
    name: production
    url: https://adenyrr.me
  only:
    - main
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual  # Manual deployment to be safe
