image: node:22-alpine

variables:
  npm_config_cache: "$CI_PROJECT_DIR/.npm"

stages:
  - maintenance
  - build
  - deploy

build:
  stage: build
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
    policy: pull-push
  before_script:
    - apk add --no-cache git
    - npm ci --prefer-offline --legacy-peer-deps
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

deploy_cloudflare_pages:
  stage: deploy
  image: node:22-alpine
  before_script:
    - npm install -g wrangler
  script:
    - wrangler pages deploy dist/ --project-name=home
  environment:
    name: production
    url: https://adenyrr.me
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"'

credly_sync:
  stage: maintenance
  image: node:22-alpine
  before_script:
    - apk add --no-cache git
    - 'test -n "$CREDLY_PUSH_TOKEN" || (echo "Missing CI/CD variable: CREDLY_PUSH_TOKEN"; exit 1)'
    - npm ci --prefer-offline --legacy-peer-deps
  script:
    - npm run sync:credly
    - |
      if ! git diff --quiet -- config/home.yaml; then
        git config user.name "GitLab CI"
        git config user.email "gitlab-ci@localhost"
        git add config/home.yaml
        git commit -m "chore: sync Credly certifications"
        git push "https://oauth2:${CREDLY_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "HEAD:${CI_DEFAULT_BRANCH}"
      else
        echo "[Credly] No certification change; build and deploy skipped."
      fi
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
